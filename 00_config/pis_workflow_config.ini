;;===========================================================================
;; pis_workflow_config.ini
;; Minimal PIS workflow configuration (one step: apply Contact Pressure legend)
;;
;; Rules understood by _tcl_pis_00_common.tcl ::pis::common::load_config
;;   - section headers are written with square brackets
;;   - section names and key names are stored lowercase
;;   - blank lines, lines starting with '#' and lines starting with ';' are
;;     ignored
;;   - every other line must be  key = value  and must follow a section header
;;   - CRLF and LF files are both accepted
;;
;; Relative folder/file paths are resolved against the workflow root folder
;; (the folder that contains 00_config and 01_scripts).
;;===========================================================================

[folders]
config_dir  = 00_config
script_dir  = 01_scripts
working_dir = 02_working

[working]
workflow_log    = 02_working/workflow.log
error_log       = 02_working/errors.log
run_status_csv  = 02_working/run_status.csv
workflow_status = 02_working/workflow_status.ini

[format]
; Replace the placeholder with the real Contact Pressure legend file exported
; from HyperView, or pick another file at run time from the GUI.
legend_file = 00_config/legend_default.tcl

[workflow]
run_order     = 02
stop_on_error = true
write_log     = true
write_status  = true

[script_02]
enabled = true
file    = _tcl_pis_02_apply_contact_pressure_legend.tcl
proc    = ::pis::step02::run
title   = Apply Contact Pressure Legend
